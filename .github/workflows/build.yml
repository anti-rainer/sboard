name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: '发布正式版 Release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '发布预发布版 Pre-release'
        required: false
        type: boolean
        default: false
      version:
        description: '版本号 (仅正式版需要填写，如 v1.0.6)'
        required: false
        default: 'v1.0.6'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.4'
  NODE_VERSION: '24'
  ACTIONS_RUNNER_FORCED_ACTIONS_NODE_VERSION: node24

jobs:
  build-web:
    name: Build Frontend
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCED_ACTIONS_NODE_VERSION: node24
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: cmd/sboard/web
          retention-days: 1

  build-sboard:
    name: Build SBoard (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: build-web
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCED_ACTIONS_NODE_VERSION: node24
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          # Windows
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: 386
          # macOS
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: cmd/sboard/web

      - name: Setup Go
        run: |
          curl -LO https://go.dev/dl/go${{ env.GO_VERSION }}.linux-amd64.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go${{ env.GO_VERSION }}.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Build sboard
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          # 使用传入的版本号或默认 dev
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="dev"
          fi
          # 构建标识：同一批次的所有架构共用同一个值，用于面板与 agent
          # 相互识别「是否来自同一次发布」。不能依赖二进制 hash ——
          # 不同架构（amd64/arm64/armv7）编译产物天然不同，无法直接比对。
          # 取 release 事件时间戳 + commit，保证同批次内所有 job 算出同一值。
          BUILD_ID=$(printf '%s|%s' "${GITHUB_SHA}" "${{ github.event.inputs.version }}" | sha256sum | cut -c1-32)
          BUILD_ID=$(printf '%s' "${BUILD_ID}" | base64 | tr -d '\n')
          echo "BUILD_ID=${BUILD_ID}"

          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.BuildID=${BUILD_ID}"
          
          if [ "$GOOS" = "windows" ]; then
            go build -ldflags "${LDFLAGS}" -o sboard.exe ./cmd/sboard
          else
            go build -ldflags "${LDFLAGS}" -o sboard ./cmd/sboard
          fi

      - name: Package
        run: |
          PLATFORM="${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            PLATFORM="${{ matrix.goos }}_armv${{ matrix.goarm }}"
          fi
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "sboard_${PLATFORM}.zip" sboard.exe
          else
            zip -j "sboard_${PLATFORM}.zip" sboard
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sboard_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: sboard_*.zip
          retention-days: 5

  build-agent:
    name: Build Agent (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCED_ACTIONS_NODE_VERSION: node24
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          # Windows
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: 386
          # macOS
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        run: |
          curl -LO https://go.dev/dl/go${{ env.GO_VERSION }}.linux-amd64.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go${{ env.GO_VERSION }}.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Download cores (sing-box)
        run: |
          # 确定架构名称 (arm + goarm -> armv6/armv7)
          ARCH="${{ matrix.goarch }}"
          if [ "$ARCH" = "arm" ] && [ -n "${{ matrix.goarm }}" ]; then
            ARCH="armv${{ matrix.goarm }}"
          fi
          
          # 使用 Go 构建工具下载对应平台的核心
          go run ./cmd/build -os=${{ matrix.goos }} -arch=${ARCH} -only-download -v

      - name: Build agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          # 使用传入的版本号或默认 dev
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="dev"
          fi
          # 同 build-sboard：同一算法算出同一个 BUILD_ID，
          # 面板与 agent 二进制因此带上相同的批次标识。
          BUILD_ID=$(printf '%s|%s' "${GITHUB_SHA}" "${{ github.event.inputs.version }}" | sha256sum | cut -c1-32)
          BUILD_ID=$(printf '%s' "${BUILD_ID}" | base64 | tr -d '\n')
          echo "BUILD_ID=${BUILD_ID}"

          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.BuildID=${BUILD_ID}"
          
          if [ "$GOOS" = "windows" ]; then
            go build -ldflags "${LDFLAGS}" -o sboard-agent.exe ./cmd/agent
          else
            go build -ldflags "${LDFLAGS}" -o sboard-agent ./cmd/agent
          fi

      - name: Package
        run: |
          PLATFORM="${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            PLATFORM="${{ matrix.goos }}_armv${{ matrix.goarm }}"
          fi
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "sboard-agent_${PLATFORM}.zip" sboard-agent.exe
          else
            zip -j "sboard-agent_${PLATFORM}.zip" sboard-agent
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sboard-agent_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: sboard-agent_*.zip
          retention-days: 5

  release:
    name: Create Release
    needs: [build-sboard, build-agent]
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCED_ACTIONS_NODE_VERSION: node24
    if: ${{ github.event.inputs.release == 'true' || github.event.inputs.prerelease == 'true' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            # 正式版：使用用户输入的版本号
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "错误：发布正式版需要填写版本号"
              exit 1
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name=$VERSION" >> $GITHUB_OUTPUT
          else
            # 预发布版：固定使用 pre-release tag，每次覆盖
            VERSION="pre-release"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "name=Pre-release (Latest)" >> $GITHUB_OUTPUT
          fi
          echo "确定版本号: $VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing pre-release
        if: ${{ github.event.inputs.prerelease == 'true' }}
        run: |
          # 删除旧的 pre-release（如果存在）
          gh release delete pre-release --yes 2>/dev/null || true
          git push origin :refs/tags/pre-release 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: sboard*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.name }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          body: |
            ## SBoard ${{ steps.version.outputs.version }}
            
            ### 下载
            
            **面板 (sboard)**
            | 平台 | 架构 | 下载 |
            |------|------|------|
            | Linux | amd64 | [sboard_linux_amd64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard_linux_amd64.zip) |
            | Linux | 386 | [sboard_linux_386.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard_linux_386.zip) |
            | Linux | arm64 | [sboard_linux_arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard_linux_arm64.zip) |
            | Linux | armv7 | [sboard_linux_armv7.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard_linux_armv7.zip) |
            | Linux | armv6 | [sboard_linux_armv6.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard_linux_armv6.zip) |
            | Windows | amd64 | [sboard_windows_amd64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard_windows_amd64.zip) |
            | Windows | arm64 | [sboard_windows_arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard_windows_arm64.zip) |
            | Windows | 386 | [sboard_windows_386.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard_windows_386.zip) |
            | macOS | amd64 | [sboard_darwin_amd64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard_darwin_amd64.zip) |
            | macOS | arm64 | [sboard_darwin_arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard_darwin_arm64.zip) |
            
            **Agent (sboard-agent)**
            | 平台 | 架构 | 下载 |
            |------|------|------|
            | Linux | amd64 | [sboard-agent_linux_amd64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard-agent_linux_amd64.zip) |
            | Linux | 386 | [sboard-agent_linux_386.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard-agent_linux_386.zip) |
            | Linux | arm64 | [sboard-agent_linux_arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard-agent_linux_arm64.zip) |
            | Linux | armv7 | [sboard-agent_linux_armv7.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard-agent_linux_armv7.zip) |
            | Linux | armv6 | [sboard-agent_linux_armv6.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard-agent_linux_armv6.zip) |
            | Windows | amd64 | [sboard-agent_windows_amd64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard-agent_windows_amd64.zip) |
            | Windows | arm64 | [sboard-agent_windows_arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard-agent_windows_arm64.zip) |
            | Windows | 386 | [sboard-agent_windows_386.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard-agent_windows_386.zip) |
            | macOS | amd64 | [sboard-agent_darwin_amd64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard-agent_darwin_amd64.zip) |
            | macOS | arm64 | [sboard-agent_darwin_arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/sboard-agent_darwin_arm64.zip) |
            
            ### 安装
            
            ```bash
            # 一键安装面板
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-sboard.sh | bash
            
            # 安装 Agent (从面板获取脚本)
            curl -fsSL https://your-panel.com/install-agent.sh | bash -s -- --token <token>
            ```
            
            ### 校验
            
            请下载 `checksums.txt` 验证文件完整性。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
